[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amnesia-genius"
version = "0.4.0"
description = "A minimal self-directed agent that runs bash commands."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.15"
dependencies = ["litellm>=1.98,<2"]

[project.scripts]
amnesia-genius = "amnesia_genius.cli:main"

[tool.setuptools]
packages = ["amnesia_genius"]

[tool.setuptools.package-data]
"amnesia_genius" = ["data/*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]

[tool.mypy]
files = ["amnesia_genius"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*"]
ignore_missing_imports = true
follow_imports = "skip"
