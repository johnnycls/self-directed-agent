[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "amnesia-genius"
version = "0.2.0"
description = "A minimal self-directed agent that runs bash commands."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = ["litellm>=1.98,<2"]

[project.scripts]
amnesia-genius = "amnesia_genius.cli:main"

[tool.setuptools]
packages = ["amnesia_genius"]

[tool.setuptools.package-data]
"amnesia_genius" = ["data/*"]
