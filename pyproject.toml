[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "self-directed-agent"
version = "0.2.0"
description = "A minimal self-directed agent that runs bash commands."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = ["litellm>=1.98,<2"]

[project.scripts]
self-directed-agent = "self_directed_agent.cli:main"

[tool.setuptools]
packages = ["self_directed_agent"]

[tool.setuptools.package-data]
"self_directed_agent" = ["data/*"]
